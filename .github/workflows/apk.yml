# Compila la app de Android en los servidores de GitHub.
#
# POR QUÉ. Android Studio pide unos 8 GB de RAM solo para él, y el PC
# donde se desarrolla esto tiene 8 GB en total. Compilar en la nube deja
# el proyecto construible sin instalar nada en la máquina: se sube el
# código y se baja el APK.
#
# No compila la app web: eso lo hace Vercel (o `npm run build` en local).
# Aquí solo se toca la carpeta android/.

name: APK de Android

on:
  # A mano, desde la pestaña Actions de GitHub.
  workflow_dispatch:
  # Y automáticamente cuando se toque algo de la app de Android, para
  # enterarse de que algo no compila el día que se rompe, no el día que
  # hace falta instalarla.
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner de Ubuntu ya trae el SDK de Android; esto se asegura
      # de que las licencias estén aceptadas y las herramientas a mano.
      - name: SDK de Android
        uses: android-actions/setup-android@v3

      # Gradle se instala aquí en vez de usar un wrapper: así el
      # repositorio no tiene que llevar un .jar binario dentro, que es
      # justo lo que no se puede revisar leyendo el código.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar el APK de depuración
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # El APK queda para descargar desde la página de la ejecución,
      # en "Artifacts". Se instala tal cual en los dos teléfonos.
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: oyente-finanzas-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
